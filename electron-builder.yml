# Windows와 Linux용 설치 파일을 만듭니다. 서명하지 않은 빌드입니다.
appId: io.github.hishydrogen.uncalive
# 맥에서 Electron은 번들 이름이 한글이면 시작하자마자 멈춥니다. 파일 이름은 영문으로 두고, 보이는 이름만 한글로 합니다.
productName: Uncalive
artifactName: Uncalive-${version}-${os}-${arch}.${ext}
copyright: "© 2026 Hishydrogen"
directories:
  output: dist
  buildResources: resources
files:
  - build/**/*
  - "!build/**/*.map"
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asar: true
# 화면 글자는 한국어뿐이므로 Chromium 언어 파일도 한국어와 영어만 넣습니다.
electronLanguages:
  - ko
  - en-US
win:
  icon: resources/icon.png
  executableName: Uncalive
  # 2.1.0부터 설치판만 만듭니다. 포터블판(zip)은 데이터를 어차피 %APPDATA%에 두어 이점이 적고, 네트워크 경로에서 뜨지 않았습니다.
  target:
    - target: nsis
# 나무덤프와 같이 마법사 없이 진행 막대만 보이는 원클릭 설치입니다. 현재 사용자 계정에 설치하고 끝나면 바로 실행합니다.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  # 바탕 화면 바로가기는 installer.nsh에서 직접 만듭니다. electron-builder는 바로가기를 만든 뒤 앱 ID(AUMID)를 덧써 넣는데,
  # Parallels처럼 맥과 같이 쓰는 바탕 화면에서는 그 사이에 바로가기가 실행 대상이 빈 채로 바뀌었습니다.
  createDesktopShortcut: false
  shortcutName: 언카라이브
  uninstallDisplayName: 언카라이브
  artifactName: Uncalive-${version}-Windows-${arch}-Setup.${ext}
# 예전 AppImage 실행기(기본값 0.0.0)는 시스템의 libfuse2를 써야 하고, arm64용은 개발용 이름(libz.so)까지 찾아
# 페도라 같은 배포판에서 아무 반응 없이 실행되지 않았습니다. 1.0.3은 라이브러리를 품은 정적 실행기를 씁니다.
toolsets:
  appimage: "1.0.3"
linux:
  icon: resources/icon.png
  category: Network
  executableName: uncalive
  artifactName: Uncalive-${version}-Linux-${arch}.${ext}
  # deb(Debian·Ubuntu 계열)와 rpm(Fedora·openSUSE 계열)은 설치할 때 관리자 권한으로 chrome-sandbox 권한과
  # Ubuntu 24.04 이후의 AppArmor 설정을 넣으므로, AppImage와 달리 보안 격리를 끄지 않고 실행됩니다.
  target:
    - AppImage
    - deb
    - rpm
deb:
  # deb는 관리자 주소가 있어야 만들어집니다. 커밋에 쓰는 GitHub 공개용 주소입니다.
  maintainer: "Hishydrogen <196475444+hishydrogen@users.noreply.github.com>"
mac:
  # 맥 26 이상은 리퀴드 글래스 아이콘을, 그 이전 맥은 같은 파일에서 만든 일반 아이콘을 씁니다. Xcode 26 이상의 actool이 필요합니다.
  icon: resources/AppIcon.icon
  category: public.app-category.utilities
  minimumSystemVersion: "13.0"
  artifactName: Uncalive-${version}-macOS-${arch}.${ext}
  # 애플 개발자 인증서 없이 만듭니다. 애플 실리콘에서 실행되도록 임시(ad-hoc) 서명만 합니다.
  identity: "-"
  hardenedRuntime: false
  # Finder와 Launchpad의 한글 이름은 언어별 이름 파일(InfoPlist.strings)에서 옵니다.
  # 기본 이름이 파일 이름(Uncalive)과 같아야 macOS가 사용자가 이름을 바꾼 앱으로 여기지 않고 한글 이름을 보여 줍니다.
  extendInfo:
    CFBundleDisplayName: Uncalive
    LSHasLocalizedDisplayName: true
  extraResources:
    - from: resources/mac/InfoPlist.strings
      to: ko.lproj/InfoPlist.strings
    - from: resources/mac/InfoPlist.strings
      to: en.lproj/InfoPlist.strings
  target:
    - target: dmg
    - target: zip
dmg:
  title: 언카라이브
